<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pío IA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 20px 0 10px;
}

#estado {
  margin: 15px;
  font-size: 17px;
}

#zona {
  width: 95%;
  max-width: 700px;
  margin: auto;
}

video {
  width: 100%;
  max-height: 55vh;
  background: black;
  border-radius: 20px;
  object-fit: cover;
}

#respuesta {
  width: 95%;
  max-width: 700px;
  margin: 15px auto;
  padding: 18px;
  background: #222;
  border-radius: 16px;
  min-height: 70px;
  text-align: left;
  line-height: 1.5;
  white-space: pre-wrap;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 13px 18px;
  margin: 5px;
  font-size: 16px;
  font-weight: bold;
}

#encender {
  background: #00c853;
  color: white;
}

#apagar {
  background: #d50000;
  color: white;
}

#enviar {
  background: #2979ff;
  color: white;
}

#texto {
  width: 95%;
  max-width: 700px;
  height: 70px;
  margin-top: 10px;
  border-radius: 12px;
  border: 0;
  padding: 12px;
  font-size: 16px;
}
</style>
</head>

<body>

<h1>🤖 Pío IA</h1>

<div id="estado">
🧠 Preparando IA...
</div>

<div id="zona">
  <video id="video" autoplay playsinline muted></video>
</div>

<button id="encender">
📷 Encender cámara
</button>

<button id="apagar">
⛔ Apagar cámara
</button>

<br>

<textarea
  id="texto"
  placeholder="También puedes escribir aquí..."
></textarea>

<br>

<button id="enviar">
💬 Enviar
</button>

<div id="respuesta">
Preparando el cerebro...
</div>


<script type="module">

/*
=========================================
  IMPORTANTE
=========================================
*/

const estado =
  document.getElementById("estado");

const respuesta =
  document.getElementById("respuesta");

const video =
  document.getElementById("video");

const texto =
  document.getElementById("texto");

const enviar =
  document.getElementById("enviar");

const encender =
  document.getElementById("encender");

const apagar =
  document.getElementById("apagar");


let cerebro = null;

let stream = null;

let reconocimiento = null;

let escuchando = false;

let hablando = false;

let asistenteActivo = false;

let temporizador = null;

let conversacion = [];


/*
=========================================
  🧠 CARGAR TRANSFORMERS.JS
=========================================
*/

async function iniciarIA() {

  try {

    estado.textContent =
      "🧠 Conectando con el motor de IA...";

    respuesta.textContent =
      "Cargando Qwen 0.5B Q4...";


    /*
      Importamos Transformers.js
      DESDE EL MISMO SCRIPT.

      Si falla, mostraremos el error.
    */

    const Transformers =
      await import(
        "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2"
      );


    const pipeline =
      Transformers.pipeline;


    estado.textContent =
      "⏳ Descargando el cerebro Q4...";

    respuesta.textContent =
      "La primera carga puede tardar bastante. No cierres esta página.";


    /*
      Qwen 0.5B Q4 + WebGPU.

      Esta es la configuración
      documentada por Hugging Face.
    */

    cerebro =
      await pipeline(

        "text-generation",

        "onnx-community/Qwen2.5-0.5B-Instruct",

        {
          dtype: "q4",
          device: "webgpu"
        }

      );


    estado.textContent =
      "🟢 Cerebro listo";

    respuesta.textContent =
      "¡Listo! Puedes escribirme una pregunta.";


  } catch (error) {

    console.error(error);

    estado.textContent =
      "❌ Error al cargar la IA";

    respuesta.textContent =
      "ERROR:\n\n" +
      error.message;

  }

}


/*
=========================================
  📷 CÁMARA
=========================================
*/

async function encenderCamara(
  tipo = "environment"
) {

  try {

    if (stream) {

      stream
        .getTracks()
        .forEach(track => track.stop());

    }


    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: tipo
          },

          audio: false

        });


    video.srcObject =
      stream;


    asistenteActivo =
      true;


    if (tipo === "user") {

      estado.textContent =
        "🟢 Cámara frontal activa + escuchando";

    } else {

      estado.textContent =
        "🟢 Cámara trasera activa + escuchando";

    }


    iniciarEscucha();


  } catch (error) {

    console.error(error);

    estado.textContent =
      "❌ No puedo acceder a la cámara";

    hablar(
      "No puedo acceder a la cámara."
    );

  }

}


function apagarCamara() {

  if (stream) {

    stream
      .getTracks()
      .forEach(track => track.stop());

    stream = null;

  }


  video.srcObject =
    null;


  /*
    El micrófono permanece activo.
  */

  asistenteActivo =
    true;


  estado.textContent =
    "🔴 Cámara apagada. Te sigo escuchando.";

}


/*
=========================================
  🔊 VOZ
=========================================
*/

function hablar(mensaje) {

  detenerEscucha();

  speechSynthesis.cancel();

  hablando = true;


  respuesta.textContent =
    "🤖 " + mensaje;


  const voz =
    new SpeechSynthesisUtterance(
      mensaje
    );


  voz.lang =
    "es-ES";

  voz.rate =
    1;

  voz.pitch =
    1;

  voz.volume =
    1;


  voz.onend =
    function() {

      hablando = false;


      setTimeout(
        iniciarEscucha,
        500
      );

    };


  speechSynthesis.speak(
    voz
  );

}


/*
=========================================
  🎤 VOZ A TEXTO
=========================================
*/

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  reconocimiento =
    new SpeechRecognition();


  reconocimiento.lang =
    "es-ES";


  reconocimiento.continuous =
    true;


  reconocimiento.interimResults =
    true;


  reconocimiento.onstart =
    function() {

      escuchando =
        true;

      estado.textContent =
        "🎤 Escuchando...";

    };


  reconocimiento.onresult =
    function(event) {

      if (hablando) {
        return;
      }


      let frase = "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        frase +=
          event.results[i][0]
            .transcript;

      }


      frase =
        frase.trim();


      if (!frase) {
        return;
      }


      respuesta.textContent =
        "👤 " + frase;


      clearTimeout(
        temporizador
      );


      /*
        1 segundo sin hablar.
      */

      temporizador =
        setTimeout(
          function() {

            procesar(
              frase
            );

          },
          1000
        );

    };


  reconocimiento.onerror =
    function(event) {

      console.log(
        "Voice error:",
        event.error
      );

    };


  reconocimiento.onend =
    function() {

      escuchando =
        false;


      if (
        asistenteActivo &&
        !hablando
      ) {

        setTimeout(
          iniciarEscucha,
          400
        );

      }

    };

}


/*
=========================================
  🎤 INICIAR ESCUCHA
=========================================
*/

function iniciarEscucha() {

  if (!reconocimiento) {
    return;
  }


  if (!asistenteActivo) {
    return;
  }


  if (hablando) {
    return;
  }


  if (escuchando) {
    return;
  }


  try {

    reconocimiento.start();

  } catch (error) {

    console.log(error);

  }

}


/*
=========================================
  🛑 DETENER ESCUCHA
=========================================
*/

function detenerEscucha() {

  if (!reconocimiento) {
    return;
  }


  try {

    reconocimiento.stop();

  } catch (error) {

    console.log(error);

  }


  escuchando =
    false;

}


/*
=========================================
  🧠 PROCESAR LO QUE DICES
=========================================
*/

async function procesar(frase) {

  const t =
    frase
      .toLowerCase()
      .trim();


  /*
    ENCENDER CÁMARA
  */

  if (
    t.includes("enciende la cámara") ||
    t.includes("enciende cámara") ||
    t.includes("prende la cámara") ||
    t.includes("prende cámara")
  ) {

    await encenderCamara(
      "environment"
    );

    hablar(
      "He encendido la cámara."
    );

    return;

  }


  /*
    CÁMARA FRONTAL
  */

  if (
    t.includes("cámara frontal") ||
    t.includes("camara frontal")
  ) {

    await encenderCamara(
      "user"
    );

    hablar(
      "He cambiado a la cámara frontal."
    );

    return;

  }


  /*
    CÁMARA TRASERA
  */

  if (
    t.includes("cámara trasera") ||
    t.includes("camara trasera")
  ) {

    await encenderCamara(
      "environment"
    );

    hablar(
      "He cambiado a la cámara trasera."
    );

    return;

  }


  /*
    APAGAR CÁMARA
  */

  if (
    t.includes("apaga la cámara") ||
    t.includes("apaga cámara") ||
    t.includes("apagar la cámara") ||
    t.includes("apagar cámara")
  ) {

    apagarCamara();

    hablar(
      "He apagado la cámara. Te sigo escuchando."
    );

    return;

  }


  /*
    TODO LO DEMÁS:
    VA AL CEREBRO.
  */

  await preguntarIA(
    frase
  );

}


/*
=========================================
  🧠 PREGUNTAR A QWEN
=========================================
*/

async function preguntarIA(
  pregunta
) {

  if (!cerebro) {

    hablar(
      "Mi cerebro todavía no está listo. Mira el mensaje de la pantalla para ver qué ocurrió."
    );

    return;

  }


  estado.textContent =
    "🧠 Pensando...";


  conversacion.push({

    role: "user",

    content:
      pregunta

  });


  /*
    Conservamos las últimas
    8 intervenciones para ahorrar
    memoria en el móvil.
  */

  if (
    conversacion.length > 8
  ) {

    conversacion =
      conversacion.slice(-8);

  }


  const mensajes = [

    {
      role: "system",

      content:
        "Eres Pío IA. Responde siempre en español. Sé natural, clara y útil. Si el usuario pide que le expliques algo, explica paso a paso. Si pregunta sobre programación, enseña el código y explica cómo funciona. No inventes información."
    },

    ...conversacion

  ];


  try {

    const salida =
      await cerebro(
        mensajes,
        {
          max_new_tokens: 160
        }
      );


    const generada =
      salida[0]
        .generated_text;


    /*
      Qwen devuelve una conversación.
      Tomamos el último mensaje.
    */

    const ultimo =
      generada[
        generada.length - 1
      ];


    let respuestaIA = "";


    if (
      ultimo &&
      typeof ultimo === "object" &&
      ultimo.content
    ) {

      respuestaIA =
        ultimo.content;

    } else {

      respuestaIA =
        String(
          ultimo || ""
        );

    }


    respuestaIA =
      respuestaIA.trim();


    if (!respuestaIA) {

      respuestaIA =
        "No he conseguido generar una respuesta.";

    }


    conversacion.push({

      role: "assistant",

      content:
        respuestaIA

    });


    estado.textContent =
      "🟢 Listo";


    hablar(
      respuestaIA
    );


  } catch (error) {

    console.error(error);

    estado.textContent =
      "❌ Error al responder";

    respuesta.textContent =
      "Error:\n" +
      error.message;

  }

}


/*
=========================================
  ✍️ TEXTO
=========================================
*/

enviar.onclick =
  async function() {

    const pregunta =
      texto.value.trim();


    if (!pregunta) {
      return;
    }


    texto.value =
      "";


    asistenteActivo =
      true;


    await procesar(
      pregunta
    );

  };


/*
=========================================
  ENTER
=========================================
*/

texto.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      enviar.click();

    }

  }
);


/*
=========================================
  BOTONES
=========================================
*/

encender.onclick =
  function() {

    encenderCamara(
      "environment"
    );

  };


apagar.onclick =
  function() {

    apagarCamara();

  };


/*
=========================================
  🚀 ARRANCAR
=========================================
*/

iniciarIA();

</script>

</body>
</html>
