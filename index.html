<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pío IA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 18px 0 8px;
}

#estado {
  margin: 12px;
  font-size: 17px;
}

#zona {
  width: 95%;
  max-width: 700px;
  margin: auto;
}

video {
  width: 100%;
  max-height: 55vh;
  background: black;
  border-radius: 20px;
  object-fit: cover;
}

#respuesta {
  width: 95%;
  max-width: 700px;
  margin: 15px auto;
  padding: 18px;
  background: #222;
  border-radius: 16px;
  min-height: 70px;
  text-align: left;
  line-height: 1.5;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 13px 18px;
  margin: 5px;
  font-size: 16px;
  font-weight: bold;
}

#encender {
  background: #00c853;
  color: white;
}

#apagar {
  background: #d50000;
  color: white;
}

#texto {
  width: 95%;
  max-width: 700px;
  height: 70px;
  margin-top: 10px;
  border-radius: 12px;
  border: 0;
  padding: 12px;
  font-size: 16px;
}
</style>
</head>

<body>

<h1>🤖 Pío IA</h1>

<div id="estado">
🔵 Di «enciende la cámara» para comenzar
</div>

<div id="zona">
  <video id="video" autoplay playsinline muted></video>
</div>

<button id="encender">📷 Encender cámara</button>
<button id="apagar">⛔ Apagar cámara</button>

<br>

<textarea
  id="texto"
  placeholder="También puedes escribir aquí..."
></textarea>

<br>

<button id="enviar">💬 Enviar</button>

<div id="respuesta">
Estoy esperando...
</div>


<script type="module">

import { pipeline }
from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";


/* ==================================
   ELEMENTOS
================================== */

const video =
  document.getElementById("video");

const estado =
  document.getElementById("estado");

const respuesta =
  document.getElementById("respuesta");

const texto =
  document.getElementById("texto");

const enviar =
  document.getElementById("enviar");

const encender =
  document.getElementById("encender");

const apagar =
  document.getElementById("apagar");


/* ==================================
   VARIABLES
================================== */

let stream = null;

let cerebro = null;

let reconocimiento = null;

let escuchando = false;

let hablando = false;

let temporizador = null;

let conversacion = [];


/*
  Al principio NO escuchamos.
*/
let asistenteActivo = false;


/* ==================================
   🧠 CARGAR CEREBRO
================================== */

async function cargarCerebro() {

  try {

    estado.textContent =
      "🧠 Cargando cerebro Q4...";

    cerebro = await pipeline(
      "text-generation",
      "onnx-community/Qwen2.5-0.5B-Instruct",
      {
        dtype: "q4",
        device: "webgpu"
      }
    );

    estado.textContent =
      "🟢 Cerebro listo. Di «enciende la cámara».";

    respuesta.textContent =
      "Estoy lista para hablar contigo.";

  }

  catch (error) {

    console.error(error);

    estado.textContent =
      "❌ No se pudo cargar el cerebro.";

    respuesta.textContent =
      "Error al cargar el modelo: " +
      error.message;

  }

}


/* ==================================
   📷 ENCENDER CÁMARA
================================== */

async function encenderCamara(tipo = "environment") {

  try {

    if (stream) {

      stream
        .getTracks()
        .forEach(track => track.stop());

    }

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: tipo
          },

          audio: false

        });


    video.srcObject = stream;


    asistenteActivo = true;


    if (tipo === "user") {

      estado.textContent =
        "🟢 Cámara frontal + IA activas";

    } else {

      estado.textContent =
        "🟢 Cámara trasera + IA activas";

    }


    /*
      Empezamos a escuchar
      solamente ahora.
    */

    iniciarEscucha();

  }

  catch (error) {

    console.error(error);

    estado.textContent =
      "❌ No puedo acceder a la cámara.";

    hablar(
      "No puedo acceder a la cámara."
    );

  }

}


/* ==================================
   ⛔ APAGAR CÁMARA
================================== */

function apagarCamara() {

  if (stream) {

    stream
      .getTracks()
      .forEach(track => track.stop());

    stream = null;

  }

  video.srcObject = null;

  /*
    IMPORTANTE:
    NO apagamos el asistente.
    El micrófono sigue funcionando.
  */

  asistenteActivo = true;

  estado.textContent =
    "🔴 Cámara apagada. Te sigo escuchando.";

}


/* ==================================
   🔊 HABLAR
================================== */

function hablar(mensaje) {

  /*
    Primero apagamos el reconocimiento
    para que no escuche nuestra voz.
  */

  detenerEscucha();

  speechSynthesis.cancel();

  hablando = true;

  respuesta.textContent =
    "🤖 " + mensaje;


  const voz =
    new SpeechSynthesisUtterance(
      mensaje
    );

  voz.lang = "es-ES";

  voz.rate = 1;

  voz.pitch = 1;

  voz.volume = 1;


  voz.onend = function () {

    hablando = false;


    setTimeout(
      iniciarEscucha,
      500
    );

  };


  speechSynthesis.speak(voz);

}


/* ==================================
   🎤 RECONOCIMIENTO DE VOZ
================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  reconocimiento =
    new SpeechRecognition();

  reconocimiento.lang =
    "es-ES";

  reconocimiento.continuous =
    true;

  reconocimiento.interimResults =
    true;


  reconocimiento.onstart =
    function () {

      escuchando = true;

      estado.textContent =
        "🎤 Escuchando...";

    };


  reconocimiento.onresult =
    function (event) {

      /*
        Nunca procesamos nuestra
        propia voz.
      */

      if (hablando) {
        return;
      }


      let frase = "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        frase +=
          event.results[i][0]
            .transcript;

      }


      frase =
        frase.trim();


      if (!frase) {
        return;
      }


      respuesta.textContent =
        "👤 " + frase;


      /*
        Cada nueva palabra reinicia
        el contador.
      */

      clearTimeout(
        temporizador
      );


      temporizador =
        setTimeout(
          function () {

            procesar(frase);

          },
          1000
        );

    };


  reconocimiento.onerror =
    function (event) {

      console.log(
        "Reconocimiento:",
        event.error
      );

    };


  reconocimiento.onend =
    function () {

      escuchando = false;


      if (
        asistenteActivo &&
        !hablando
      ) {

        setTimeout(
          iniciarEscucha,
          400
        );

      }

    };

}


/* ==================================
   🎤 INICIAR ESCUCHA
================================== */

function iniciarEscucha() {

  if (!reconocimiento) {
    return;
  }

  if (!asistenteActivo) {
    return;
  }

  if (hablando) {
    return;
  }

  if (escuchando) {
    return;
  }


  try {

    reconocimiento.start();

  }

  catch (error) {

    console.log(error);

  }

}


/* ==================================
   🛑 DETENER ESCUCHA
================================== */

function detenerEscucha() {

  if (!reconocimiento) {
    return;
  }


  try {

    reconocimiento.stop();

  }

  catch (error) {

    console.log(error);

  }


  escuchando = false;

}


/* ==================================
   🧠 PROCESAR FRASE
================================== */

async function procesar(frase) {

  const textoNormalizado =
    frase
      .toLowerCase()
      .trim();


  /* ===============================
     📷 PRENDER CÁMARA
  =============================== */

  if (
    textoNormalizado.includes(
      "enciende la cámara"
    ) ||
    textoNormalizado.includes(
      "enciende cámara"
    ) ||
    textoNormalizado.includes(
      "prende la cámara"
    ) ||
    textoNormalizado.includes(
      "prende cámara"
    )
  ) {

    await encenderCamara(
      "environment"
    );

    hablar(
      "He encendido la cámara."
    );

    return;

  }


  /* ===============================
     🤳 CÁMARA FRONTAL
  =============================== */

  if (
    textoNormalizado.includes(
      "cámara frontal"
    ) ||
    textoNormalizado.includes(
      "camara frontal"
    )
  ) {

    await encenderCamara(
      "user"
    );

    hablar(
      "He cambiado a la cámara frontal."
    );

    return;

  }


  /* ===============================
     📷 CÁMARA TRASERA
  =============================== */

  if (
    textoNormalizado.includes(
      "cámara trasera"
    ) ||
    textoNormalizado.includes(
      "camara trasera"
    ) ||
    textoNormalizado.includes(
      "cámara de atrás"
    ) ||
    textoNormalizado.includes(
      "camara de atras"
    )
  ) {

    await encenderCamara(
      "environment"
    );

    hablar(
      "He cambiado a la cámara trasera."
    );

    return;

  }


  /* ===============================
     ⛔ APAGAR CÁMARA
  =============================== */

  if (
    textoNormalizado.includes(
      "apaga la cámara"
    ) ||
    textoNormalizado.includes(
      "apaga cámara"
    ) ||
    textoNormalizado.includes(
      "apagar la cámara"
    ) ||
    textoNormalizado.includes(
      "apagar cámara"
    )
  ) {

    apagarCamara();

    hablar(
      "He apagado la cámara. Te sigo escuchando."
    );

    return;

  }


  /* ===============================
     💬 PREGUNTA AL CEREBRO
  =============================== */

  await preguntarAlCerebro(
    frase
  );

}


/* ==================================
   🧠 CONVERSACIÓN
================================== */

async function preguntarAlCerebro(
  preguntaUsuario
) {

  if (!cerebro) {

    hablar(
      "Todavía estoy cargando mi cerebro. Espera un momento."
    );

    return;

  }


  estado.textContent =
    "🧠 Pensando...";


  /*
    Guardamos la conversación.
  */

  conversacion.push({

    role: "user",

    content:
      preguntaUsuario

  });


  /*
    Limitamos el historial para
    que el móvil no se quede sin memoria.
  */

  if (
    conversacion.length > 10
  ) {

    conversacion =
      conversacion.slice(-10);

  }


  const mensajes = [

    {
      role: "system",

      content:
        `Eres Pío IA, un asistente inteligente
        que habla español.

        Responde de forma natural y útil.

        Si el usuario pide una explicación,
        explica paso a paso.

        Si pregunta programación,
        puedes enseñar HTML, CSS, JavaScript,
        Python, C++, Java, Roblox Lua,
        Unity, GDevelop y otras tecnologías.

        Si pide código, proporciona código
        y explica cómo utilizarlo.

        No inventes que puedes acceder a Internet
        o a la cámara si no tienes esa herramienta.

        Responde de manera clara y adecuada
        a la pregunta del usuario.`
    },

    ...conversacion

  ];


  try {

    const salida =
      await cerebro(
        mensajes,
        {
          max_new_tokens: 256,

          temperature: 0.7
        }
      );


    const ultima =
      salida[0]
        .generated_text
        .at(-1);


    const respuestaIA =
      ultima.content;


    conversacion.push({

      role: "assistant",

      content:
        respuestaIA

    });


    estado.textContent =
      "🟢 Listo";


    hablar(
      respuestaIA
    );

  }

  catch (error) {

    console.error(error);

    estado.textContent =
      "❌ Error del cerebro";

    hablar(
      "Ha ocurrido un error al generar la respuesta."
    );

  }

}


/* ==================================
   ✍️ TEXTO
================================== */

enviar.onclick =
  async function () {

    const pregunta =
      texto.value.trim();


    if (!pregunta) {
      return;
    }


    /*
      Activamos el asistente
      si escribes manualmente.
    */

    asistenteActivo = true;


    texto.value = "";


    await procesar(
      pregunta
    );

  };


/* ==================================
   ⌨️ ENTER
================================== */

texto.addEventListener(
  "keydown",
  function (event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      enviar.click();

    }

  }
);


/* ==================================
   🔘 BOTONES
================================== */

encender.onclick =
  function () {

    encenderCamara(
      "environment"
    );

  };


apagar.onclick =
  function () {

    apagarCamara();

  };


/* ==================================
   🚀 INICIO
================================== */

cargarCerebro();

</script>

</body>
    </html>
