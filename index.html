<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Señor Reno - Visión en Vivo</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
    #app-container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 12px; }
    video { width: 100%; border-radius: 8px; border: 2px solid #ff4757; background: #000; }
    canvas { display: none; }
    .status { margin: 15px 0; font-weight: bold; color: #2ed573; }
    button { background: #ff4757; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; margin: 5px; }
    button:hover { background: #ff6b81; }
    #chat { background: #2f3542; padding: 10px; border-radius: 6px; text-align: left; min-height: 80px; margin-top: 15px; }
  </style>
</head>
<body>

<div id="app-container">
  <h1>🦌 Señor Reno (Visión en Vivo)</h1>
  
  <label for="apiKey">Gemini API Key:</label><br>
  <input type="password" id="apiKey" placeholder="Pega tu API Key aquí" style="padding: 8px; width: 80%; margin: 10px 0;">
  
  <div>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <button id="btnStart">Iniciar Señor Reno</button>
  <button id="btnStop">Detener</button>

  <div class="status" id="statusText">Estado: Apagado</div>
  <div id="chat"><b>Señor Reno:</b> Presiona "Iniciar" para comenzar a ver.</div>
</div>

<script>
  let video = document.getElementById('webcam');
  let canvas = document.getElementById('canvas');
  let ctx = canvas.getContext('2d');
  let intervalId = null;
  let synth = window.speechSynthesis;

  // 1. Iniciar Cámara Web
  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      video.srcObject = stream;
    } catch (err) {
      alert("Error accediendo a la cámara: " + err);
    }
  }

  // 2. Hablar con Voz Novedosa
  function hablar(texto) {
    if (synth.speaking) synth.cancel();
    const utterance = new SpeechSynthesisUtterance(texto);
    utterance.lang = 'es-ES';
    utterance.pitch = 1.2; // Tono ligeramente agudo para el personaje
    utterance.rate = 1.0;
    synth.speak(utterance);
  }

  // 3. Capturar Fotograma y Enviar a Gemini
  async function analizarFrame() {
    const apiKey = document.getElementById('apiKey').value;
    if (!apiKey) {
      document.getElementById('statusText').innerText = "Error: Falta la API Key";
      return;
    }

    // Dibujar frame actual en canvas
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // Convertir a Base64
    const base64Image = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];

    document.getElementById('statusText').innerText = "Señor Reno está observando...";

    const payload = {
      contents: [{
        parts: [
          { text: "Eres Señor Reno, un asistente amable y divertido. Mira el video en vivo y describe en máximo 2 oraciones breves lo que ves o lo que cambió frente a la cámara. Habla directamente al usuario." },
          { inline_data: { mime_type: "image/jpeg", data: base64Image } }
        ]
      }]
    };

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await response.json();
      const respuestaTexto = data.candidates[0].content.parts[0].text;
      
      document.getElementById('chat').innerHTML = `<b>Señor Reno:</b> ${respuestaTexto}`;
      document.getElementById('statusText').innerText = "Estado: Escaneando continuo...";
      
      // Reproducir voz
      hablar(respuestaTexto);

    } catch (err) {
      console.error(err);
      document.getElementById('statusText').innerText = "Error al procesar la imagen.";
    }
  }

  // Controladores de eventos
  document.getElementById('btnStart').addEventListener('click', () => {
    initCamera();
    // Analizar el flujo de video cada 4 segundos
    intervalId = setInterval(analizarFrame, 4000);
    document.getElementById('statusText').innerText = "Iniciando transmisión...";
  });

  document.getElementById('btnStop').addEventListener('click', () => {
    if (intervalId) clearInterval(intervalId);
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(track => track.stop());
    }
    document.getElementById('statusText').innerText = "Estado: Apagado";
  });
</script>

</body>
</html>
