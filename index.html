<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi IA - Visión</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 15px;
}

#contenedor {
    position: relative;
    width: 95%;
    max-width: 700px;
    margin: auto;
}

video {
    width: 100%;
    border-radius: 20px;
    background: black;
    display: block;
}

canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

button {
    margin: 8px;
    padding: 14px 22px;
    border: 0;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
}

#activar {
    background: #00c853;
    color: white;
}

#apagar {
    background: #d50000;
    color: white;
}

#estado {
    font-size: 17px;
}

#objetos {
    margin: 15px;
    padding: 15px;
    background: #222;
    border-radius: 15px;
    min-height: 30px;
}
</style>

<!-- TensorFlow.js -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

<!-- COCO-SSD -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

</head>

<body>

<h1>🤖 Mi IA</h1>

<div id="contenedor">

    <video id="camara" autoplay playsinline muted></video>

    <canvas id="canvas"></canvas>

</div>

<br>

<button id="activar">
📷 Activar cámara
</button>

<button id="apagar">
⛔ Apagar
</button>

<p id="estado">
🧠 Cargando visión...
</p>

<div id="objetos">
Esperando cámara...
</div>


<script>

const video =
document.getElementById("camara");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const activar =
document.getElementById("activar");

const apagar =
document.getElementById("apagar");

const estado =
document.getElementById("estado");

const objetos =
document.getElementById("objetos");


let stream = null;

let modelo = null;

let camaraActual = "environment";

let hablando = false;


/* ==========================
   🧠 CARGAR MODELO
========================== */

async function cargarModelo() {

    estado.textContent =
        "🧠 Cargando visión...";

    try {

        modelo =
            await cocoSsd.load();

        estado.textContent =
            "🟢 Visión preparada";

    }

    catch(error) {

        estado.textContent =
            "❌ No se pudo cargar la visión";

        console.error(error);

    }

}

cargarModelo();


/* ==========================
   📷 ENCENDER CÁMARA
========================== */

async function encenderCamara(tipo = camaraActual) {

    try {

        if (stream) {

            stream
            .getTracks()
            .forEach(track => track.stop());

        }

        camaraActual = tipo;

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: camaraActual
                },

                audio: false

            });

        video.srcObject = stream;

        video.onloadeddata = () => {

            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;

            detectar();

        };

        estado.textContent =
            "🟢 Cámara activada";

    }

    catch(error) {

        estado.textContent =
            "❌ No se pudo acceder a la cámara";

        console.error(error);

    }

}


/* ==========================
   ⛔ APAGAR
========================== */

function apagarCamara() {

    if (stream) {

        stream
        .getTracks()
        .forEach(track => track.stop());

        stream = null;

    }

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    objetos.textContent =
        "Cámara apagada";

    estado.textContent =
        "🔴 Cámara apagada";

}


/* ==========================
   👁️ DETECCIÓN EN VIVO
========================== */

async function detectar() {

    if (
        !modelo ||
        !stream ||
        video.readyState < 2
    ) {

        requestAnimationFrame(detectar);

        return;

    }


    const predicciones =
        await modelo.detect(
            video,
            20,
            0.55
        );


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const nombres = [];


    predicciones.forEach(objeto => {

        const [
            x,
            y,
            ancho,
            alto
        ] = objeto.bbox;


        /* CUADRO */

        ctx.strokeStyle =
            "#00ff66";

        ctx.lineWidth = 4;

        ctx.strokeRect(
            x,
            y,
            ancho,
            alto
        );


        /* TEXTO */

        const porcentaje =
            Math.round(
                objeto.score * 100
            );


        const etiqueta =
            objeto.class +
            " " +
            porcentaje +
            "%";


        ctx.fillStyle =
            "#00ff66";

        ctx.font =
            "18px Arial";

        ctx.fillText(
            etiqueta,
            x,
            Math.max(
                20,
                y - 5
            )
        );


        nombres.push(
            objeto.class
        );

    });


    if (nombres.length > 0) {

        objetos.textContent =
            "👁️ Veo: " +
            [...new Set(nombres)]
            .join(", ");

    }

    else {

        objetos.textContent =
            "👁️ No detecto objetos";

    }


    requestAnimationFrame(detectar);

}


/* ==========================
   🔊 HABLAR
========================== */

function hablar(texto) {

    /*
      Si el usuario empieza a hablar,
      esta función será cancelada.
    */

    speechSynthesis.cancel();

    hablando = true;


    const voz =
        new SpeechSynthesisUtterance(
            texto
        );

    voz.lang = "es-ES";

    voz.rate = 1;

    voz.pitch = 1;

    voz.volume = 1;


    voz.onend = () => {

        hablando = false;

    };


    speechSynthesis.speak(voz);

}


/* ==========================
   🎤 CUANDO EL USUARIO HABLA
========================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let reconocimiento = null;


if (SpeechRecognition) {

    reconocimiento =
        new SpeechRecognition();

    reconocimiento.lang =
        "es-ES";

    reconocimiento.continuous =
        true;

    reconocimiento.interimResults =
        true;


    reconocimiento.onstart = () => {

        estado.textContent =
            "🎤 Escuchando...";

    };


    reconocimiento.onresult =
        (event) => {

            /*
              EN CUANTO DETECTAMOS
              QUE EL USUARIO HABLA:

              🔇 paramos la voz de la IA
            */

            if (speechSynthesis.speaking) {

                speechSynthesis.cancel();

            }

            hablando = false;


            let frase = "";

            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                frase +=
                    event.results[i][0]
                    .transcript;

            }


            procesarComando(frase);

        };


    reconocimiento.onerror =
        (event) => {

            console.log(
                "Voz:",
                event.error
            );

        };


    reconocimiento.onend = () => {

        /*
          Volver a escuchar automáticamente.
        */

        try {

            reconocimiento.start();

        }

        catch(e) {}

    };


    try {

        reconocimiento.start();

    }

    catch(e) {}

}


/* ==========================
   🗣️ COMANDOS
========================== */

function procesarComando(frase) {

    frase =
        frase.toLowerCase();


    /* CÁMARA */

    if (
        frase.includes(
            "prende la cámara"
        ) ||
        frase.includes(
            "enciende la cámara"
        )
    ) {

        encenderCamara(
            "environment"
        );

        hablar(
            "He encendido la cámara."
        );

        return;

    }


    /* APAGAR */

    if (
        frase.includes(
            "apaga la cámara"
        ) ||
        frase.includes(
            "apagar la cámara"
        )
    ) {

        apagarCamara();

        hablar(
            "He apagado la cámara."
        );

        return;

    }


    /* FRONTAL */

    if (
        frase.includes(
            "cámara frontal"
        ) ||
        frase.includes(
            "camara frontal"
        )
    ) {

        encenderCamara("user");

        hablar(
            "He cambiado a la cámara frontal."
        );

        return;

    }


    /* TRASERA */

    if (
        frase.includes(
            "cámara trasera"
        ) ||
        frase.includes(
            "camara trasera"
        )
    ) {

        encenderCamara(
            "environment"
        );

        hablar(
            "He cambiado a la cámara trasera."
        );

        return;

    }


    /*
      Si dices cualquier otra cosa,
      por ahora mostramos lo que dijiste.
    */

    console.log(
        "Usuario:",
        frase
    );

}


/* ==========================
   BOTONES
========================== */

activar.onclick =
    () => encenderCamara(
        camaraActual
    );


apagar.onclick =
    apagarCamara;

</script>

</body>
</html>
