<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi IA</title>

<style>

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px;
}

video {
    width: 95%;
    max-width: 600px;
    border-radius: 20px;
    background: black;
}

button {
    margin: 8px;
    padding: 14px 22px;
    border: 0;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
}

#activar {
    background: #00c853;
    color: white;
}

#apagar {
    background: #d50000;
    color: white;
}

#estado {
    font-size: 18px;
    margin: 15px;
}

#texto {
    margin: 20px;
    padding: 15px;
    background: #222;
    border-radius: 15px;
    min-height: 30px;
}

</style>
</head>

<body>

<h1>🤖 Mi IA</h1>

<video id="camara" autoplay playsinline></video>

<br>

<button id="activar">📷 Activar cámara</button>
<button id="apagar">⛔ Apagar cámara</button>

<p id="estado">🔴 Cámara apagada</p>

<div id="texto">
Estoy esperando que hables...
</div>


<script>

const video = document.getElementById("camara");
const activar = document.getElementById("activar");
const apagar = document.getElementById("apagar");
const estado = document.getElementById("estado");
const texto = document.getElementById("texto");

let stream = null;
let reconocimiento = null;
let temporizador = null;
let hablando = false;

let camaraActual = "environment";


/* =========================
   📷 CÁMARA
========================= */

async function encenderCamara(tipo = camaraActual) {

    try {

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }

        camaraActual = tipo;

        stream = await navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: camaraActual
            },

            audio: false

        });

        video.srcObject = stream;

        estado.textContent =
            camaraActual === "user"
            ? "🟢 Cámara frontal activada"
            : "🟢 Cámara trasera activada";

    }

    catch (error) {

        estado.textContent =
            "❌ No pude acceder a la cámara";

        console.error(error);
    }
}


function apagarCamara() {

    if (stream) {

        stream.getTracks().forEach(track => track.stop());

        stream = null;
        video.srcObject = null;
    }

    estado.textContent = "🔴 Cámara apagada";
}


/* =========================
   🎤 VOZ
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    reconocimiento = new SpeechRecognition();

    reconocimiento.lang = "es-ES";

    reconocimiento.continuous = true;

    reconocimiento.interimResults = true;


    reconocimiento.onstart = () => {

        if (!hablando) {

            estado.textContent =
                "🎤 Escuchando...";
        }
    };


    reconocimiento.onresult = (event) => {

        if (hablando) return;

        let textoCompleto = "";

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            textoCompleto +=
                event.results[i][0].transcript;
        }


        texto.textContent =
            "👤 Tú: " + textoCompleto;


        /*
          Reiniciamos el temporizador cada vez
          que detectamos voz.
        */

        clearTimeout(temporizador);


        temporizador = setTimeout(() => {

            procesarOrden(textoCompleto);

        }, 3000);

    };


    reconocimiento.onerror = (event) => {

        console.log(
            "Error de reconocimiento:",
            event.error
        );

    };


    reconocimiento.onend = () => {

        /*
          Si la IA no está hablando,
          volvemos a escuchar.
        */

        if (!hablando) {

            try {

                reconocimiento.start();

            }

            catch (e) {}

        }

    };


    try {

        reconocimiento.start();

    }

    catch (e) {}

}


/* =========================
   🧠 PROCESAR LO QUE DICES
========================= */

function procesarOrden(frase) {

    frase = frase.toLowerCase().trim();


    /* 📷 ENCENDER CÁMARA */

    if (
        frase.includes("prende la cámara") ||
        frase.includes("enciende la cámara") ||
        frase.includes("activa la cámara") ||
        frase.includes("enciende cámara")
    ) {

        encenderCamara("environment");

        hablar(
            "He encendido la cámara."
        );

        return;
    }


    /* 📷 APAGAR CÁMARA */

    if (
        frase.includes("apaga la cámara") ||
        frase.includes("desactiva la cámara") ||
        frase.includes("apagar cámara")
    ) {

        apagarCamara();

        hablar(
            "He apagado la cámara."
        );

        return;
    }


    /* 🤳 CÁMARA FRONTAL */

    if (
        frase.includes("cámara frontal") ||
        frase.includes("camara frontal") ||
        frase.includes("mira la cámara frontal")
    ) {

        encenderCamara("user");

        hablar(
            "He cambiado a la cámara frontal."
        );

        return;
    }


    /* 📷 CÁMARA TRASERA */

    if (
        frase.includes("cámara trasera") ||
        frase.includes("camara trasera") ||
        frase.includes("cámara de atrás") ||
        frase.includes("camara de atras")
    ) {

        encenderCamara("environment");

        hablar(
            "He cambiado a la cámara trasera."
        );

        return;
    }


    /*
      👁️ VISIÓN

      Aquí después conectaremos
      el modelo de IA que analizará
      la imagen de la cámara.
    */

    if (
        frase.includes("qué ves") ||
        frase.includes("que ves") ||
        frase.includes("qué hay") ||
        frase.includes("que hay") ||
        frase.includes("describe lo que ves") ||
        frase.includes("mira esto")
    ) {

        hablar(
            "Estoy preparada para analizar la cámara. En la siguiente versión conectaré mi sistema de visión."
        );

        return;
    }


    /*
      💬 RESPUESTA NORMAL
    */

    hablar(
        "Te he escuchado. Todavía estoy conectando mi cerebro de inteligencia artificial."
    );

}


/* =========================
   🔊 HABLAR
========================= */

function hablar(mensaje) {

    hablando = true;

    /*
      Detenemos temporalmente
      el reconocimiento para que
      la IA no se escuche a sí misma.
    */

    if (reconocimiento) {

        try {

            reconocimiento.stop();

        }

        catch (e) {}

    }


    speechSynthesis.cancel();


    const voz =
        new SpeechSynthesisUtterance(mensaje);

    voz.lang = "es-ES";

    voz.rate = 1;

    voz.pitch = 1;

    voz.volume = 1;


    voz.onend = () => {

        hablando = false;

        texto.textContent =
            "🤖 IA: " + mensaje;


        setTimeout(() => {

            try {

                reconocimiento.start();

            }

            catch (e) {}

        }, 300);

    };


    speechSynthesis.speak(voz);

}

</script>

</body>
</html>
