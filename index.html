<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi IA</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px;
    }

    video {
      width: 95%;
      max-width: 600px;
      border-radius: 20px;
      background: black;
    }

    button {
      margin: 8px;
      padding: 15px 22px;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
    }

    #activar {
      background: #00c853;
      color: white;
    }

    #apagar {
      background: #d50000;
      color: white;
    }

    #hablar {
      background: #2979ff;
      color: white;
    }

    #responder {
      background: #ff9100;
      color: white;
    }

    #estado {
      font-size: 18px;
      margin: 15px;
    }

    #texto {
      margin: 20px;
      padding: 15px;
      background: #222;
      border-radius: 15px;
      min-height: 25px;
    }
  </style>
</head>

<body>

  <h1>🤖 Mi IA</h1>

  <video id="camara" autoplay playsinline></video>

  <br>

  <button id="activar">📷 Activar cámara</button>
  <button id="apagar">⛔ Apagar cámara</button>
  <br>
  <button id="hablar">🎤 Hablar</button>
  <button id="responder">🔊 Responder</button>

  <p id="estado">🔴 Cámara apagada</p>

  <div id="texto">Aquí aparecerá lo que digas...</div>

  <script>
    const video = document.getElementById("camara");
    const activar = document.getElementById("activar");
    const apagar = document.getElementById("apagar");
    const hablar = document.getElementById("hablar");
    const responder = document.getElementById("responder");
    const estado = document.getElementById("estado");
    const texto = document.getElementById("texto");

    let stream = null;
    let ultimaPregunta = "";

    // =========================
    // 📷 CÁMARA
    // =========================

    activar.onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment"
          },
          audio: false
        });

        video.srcObject = stream;
        estado.textContent = "🟢 Cámara activada";
      } catch (error) {
        estado.textContent = "❌ No se pudo acceder a la cámara";
        console.error(error);
      }
    };

    apagar.onclick = () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
        video.srcObject = null;
      }

      estado.textContent = "🔴 Cámara apagada";
    };


    // =========================
    // 🎤 RECONOCIMIENTO DE VOZ
    // =========================

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition = null;

    if (SpeechRecognition) {

      recognition = new SpeechRecognition();

      recognition.lang = "es-ES";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        estado.textContent = "🎤 Te estoy escuchando...";
      };

      recognition.onresult = (event) => {

        const resultado =
          event.results[0][0].transcript;

        ultimaPregunta = resultado;

        texto.textContent =
          "Tú: " + resultado;

        estado.textContent =
          "🟢 Te he entendido";
      };

      recognition.onerror = (event) => {
        estado.textContent =
          "❌ Error del micrófono: " + event.error;
      };

      recognition.onend = () => {
        if (estado.textContent === "🎤 Te estoy escuchando...") {
          estado.textContent = "🟢 Listo";
        }
      };

    } else {

      estado.textContent =
        "❌ Tu navegador no admite reconocimiento de voz";
    }


    hablar.onclick = () => {

      if (!recognition) {
        alert("Tu navegador no admite reconocimiento de voz.");
        return;
      }

      recognition.start();
    };


    // =========================
    // 🔊 RESPUESTA DE VOZ
    // =========================

    responder.onclick = () => {

      if (!ultimaPregunta) {
        hablarTexto("Primero dime algo.");
        return;
      }

      const respuesta =
        "He escuchado: " + ultimaPregunta +
        ". Todavía estoy aprendiendo a ver y entender la cámara.";

      texto.textContent =
        "🤖 IA: " + respuesta;

      hablarTexto(respuesta);
    };


    function hablarTexto(mensaje) {

      speechSynthesis.cancel();

      const voz =
        new SpeechSynthesisUtterance(mensaje);

      voz.lang = "es-ES";
      voz.rate = 1;
      voz.pitch = 1;
      voz.volume = 1;

      speechSynthesis.speak(voz);
    }

  </script>

</body>
</html>
