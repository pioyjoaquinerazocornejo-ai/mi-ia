<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Mi IA - Visión y Voz</title>

<style>
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  margin:18px;
}

#zona{
  position:relative;
  width:95%;
  max-width:700px;
  margin:auto;
}

video{
  width:100%;
  border-radius:20px;
  background:#000;
}

#estado{
  font-size:18px;
  margin:15px;
}

#resultado{
  margin:15px;
  padding:18px;
  background:#222;
  border-radius:15px;
  min-height:30px;
}

button{
  padding:14px 20px;
  margin:6px;
  border:0;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
}

#encender{
  background:#00c853;
  color:white;
}

#apagar{
  background:#d50000;
  color:white;
}
</style>
</head>

<body>

<h1>🤖 Mi IA</h1>

<div id="zona">
  <video id="video" autoplay playsinline muted></video>
</div>

<button id="encender">📷 Encender cámara</button>
<button id="apagar">⛔ Apagar cámara</button>

<div id="estado">🧠 Preparando...</div>

<div id="resultado">
🎤 Di algo...
</div>

<script>

const video =
document.getElementById("video");

const estado =
document.getElementById("estado");

const resultado =
document.getElementById("resultado");

const encender =
document.getElementById("encender");

const apagar =
document.getElementById("apagar");

let stream = null;
let reconocimiento = null;
let temporizador = null;
let hablando = false;


/* =========================
   📷 CÁMARA
========================= */

async function encenderCamara(tipo="environment"){

  try{

    if(stream){
      stream.getTracks().forEach(t=>t.stop());
    }

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:tipo
        },

        audio:false

      });

    video.srcObject=stream;

    estado.textContent=
      tipo==="user"
      ? "🟢 Cámara frontal"
      : "🟢 Cámara trasera";

  }

  catch(error){

    estado.textContent=
      "❌ No puedo acceder a la cámara";

    console.error(error);

  }

}


function apagarCamara(){

  if(stream){

    stream.getTracks()
      .forEach(t=>t.stop());

    stream=null;

  }

  video.srcObject=null;

  estado.textContent=
    "🔴 Cámara apagada";

}


/* =========================
   🔊 VOZ DE LA IA
========================= */

function hablar(mensaje){

  /*
    Si la IA estaba hablando,
    la detenemos.
  */

  speechSynthesis.cancel();

  hablando=true;

  resultado.textContent=
    "🤖 "+mensaje;

  const voz =
    new SpeechSynthesisUtterance(mensaje);

  voz.lang="es-ES";
  voz.rate=1;
  voz.pitch=1;
  voz.volume=1;

  voz.onend=()=>{

    hablando=false;

    iniciarEscucha();

  };

  speechSynthesis.speak(voz);

}


/* =========================
   🎤 ESCUCHAR
========================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


function iniciarEscucha(){

  if(!reconocimiento) return;

  try{
    reconocimiento.start();
  }catch(e){}

}


if(SpeechRecognition){

  reconocimiento =
    new SpeechRecognition();

  reconocimiento.lang="es-ES";

  reconocimiento.continuous=true;

  reconocimiento.interimResults=true;


  reconocimiento.onstart=()=>{

    estado.textContent=
      "🎤 Escuchando...";

  };


  reconocimiento.onresult=(event)=>{

    /*
      En cuanto el usuario habla,
      la IA se calla.
    */

    if(speechSynthesis.speaking){

      speechSynthesis.cancel();

    }

    hablando=false;


    let frase="";

    for(
      let i=event.resultIndex;
      i<event.results.length;
      i++
    ){

      frase +=
        event.results[i][0].transcript;

    }


    resultado.textContent=
      "👤 "+frase;


    /*
      Cada nueva palabra reinicia
      el temporizador.

      Cuando pasan 1 segundo
      sin hablar, procesamos.
    */

    clearTimeout(temporizador);

    temporizador =
      setTimeout(()=>{

        procesar(frase);

      },1000);

  };


  reconocimiento.onerror=(event)=>{

    console.log(
      "Reconocimiento:",
      event.error
    );

  };


  reconocimiento.onend=()=>{

    if(!hablando){

      setTimeout(
        iniciarEscucha,
        300
      );

    }

  };


}else{

  estado.textContent=
    "❌ Este navegador no permite reconocimiento de voz";

}


/* =========================
   🧠 PROCESAR COMANDOS
========================= */

function procesar(frase){

  frase =
    frase.toLowerCase()
    .trim();


  /* 📷 ENCENDER */

  if(
    frase.includes("prende la cámara") ||
    frase.includes("enciende la cámara") ||
    frase.includes("activa la cámara") ||
    frase.includes("prende cámara")
  ){

    encenderCamara("environment");

    hablar(
      "He encendido la cámara."
    );

    return;
  }


  /* ⛔ APAGAR */

  if(
    frase.includes("apaga la cámara") ||
    frase.includes("apagar la cámara") ||
    frase.includes("desactiva la cámara")
  ){

    apagarCamara();

    hablar(
      "He apagado la cámara."
    );

    return;
  }


  /* 🤳 FRONTAL */

  if(
    frase.includes("cámara frontal") ||
    frase.includes("camara frontal")
  ){

    encenderCamara("user");

    hablar(
      "He cambiado a la cámara frontal."
    );

    return;
  }


  /* 📷 TRASERA */

  if(
    frase.includes("cámara trasera") ||
    frase.includes("camara trasera") ||
    frase.includes("cámara de atrás") ||
    frase.includes("camara de atras")
  ){

    encenderCamara("environment");

    hablar(
      "He cambiado a la cámara trasera."
    );

    return;
  }


  /* 👁️ PREGUNTAS SOBRE VISIÓN */

  if(
    frase.includes("qué ves") ||
    frase.includes("que ves") ||
    frase.includes("qué hay delante") ||
    frase.includes("que hay delante") ||
    frase.includes("qué tengo delante") ||
    frase.includes("que tengo delante") ||
    frase.includes("describe lo que ves") ||
    frase.includes("describe lo que estás viendo") ||
    frase.includes("describe lo que estas viendo") ||
    frase.includes("qué hay en la cámara") ||
    frase.includes("que hay en la camara")
  ){

    analizarImagen(frase);

    return;
  }


  /*
    De momento respondemos que
    hemos escuchado.

    Después conectaremos aquí
    el cerebro de IA.
  */

  hablar(
    "Te he escuchado. La parte de conversación inteligente la añadiremos después."
  );

}


/* =========================
   👁️ ANALIZAR CÁMARA
========================= */

async function analizarImagen(pregunta){

  if(!stream){

    hablar(
      "La cámara está apagada."
    );

    return;
  }


  /*
    Por ahora comprobamos que
    podemos capturar la imagen.

    El modelo visual se conectará
    en el siguiente paso.
  */

  const canvas =
    document.createElement("canvas");

  canvas.width=
    video.videoWidth;

  canvas.height=
    video.videoHeight;

  const ctx=
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  estado.textContent=
    "👁️ Analizando la cámara...";


  /*
    DEMOSTRACIÓN TEMPORAL.

    Aquí conectaremos el modelo
    visual local.
  */

  setTimeout(()=>{

    hablar(
      "Ya tengo la imagen. Ahora conectaremos mi modelo de visión para poder describir exactamente lo que estoy viendo."
    );

  },500);

}


/* =========================
   BOTONES
========================= */

encender.onclick=
  ()=>encenderCamara();

apagar.onclick=
  apagarCamara;


/* =========================
   INICIO
========================= */

estado.textContent=
  "🟢 Lista. Pulsa Encender cámara y habla.";

</script>

</body>
  </html>
