<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi IA</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px;
    }

    #zona {
      width: 95%;
      max-width: 700px;
      margin: auto;
    }

    video {
      width: 100%;
      border-radius: 20px;
      background: black;
    }

    button {
      padding: 14px 20px;
      margin: 8px 4px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
    }

    #encender {
      background: #00c853;
      color: white;
    }

    #apagar {
      background: #d50000;
      color: white;
    }

    #estado {
      margin: 15px;
      font-size: 18px;
    }

    #resultado {
      margin: 15px;
      padding: 18px;
      background: #222;
      border-radius: 15px;
      min-height: 30px;
    }
  </style>
</head>

<body>

  <h1>🤖 Mi IA</h1>

  <div id="zona">
    <video id="video" autoplay playsinline muted></video>
  </div>

  <button id="encender">📷 Encender cámara</button>
  <button id="apagar">⛔ Apagar cámara</button>

  <div id="estado">
    🔵 Pulsa "Encender cámara" y habla
  </div>

  <div id="resultado">
    🎤 Estoy esperando...
  </div>

<script>

const video = document.getElementById("video");
const estado = document.getElementById("estado");
const resultado = document.getElementById("resultado");

const encender = document.getElementById("encender");
const apagar = document.getElementById("apagar");

let stream = null;
let reconocimiento = null;
let temporizador = null;

let hablando = false;
let escuchando = false;


/* =====================================
   📷 ENCENDER CÁMARA
===================================== */

async function encenderCamara(tipo = "environment") {

  try {

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: tipo
      },
      audio: false
    });

    video.srcObject = stream;

    if (tipo === "user") {
      estado.textContent = "🟢 Cámara frontal activa";
    } else {
      estado.textContent = "🟢 Cámara trasera activa";
    }

  } catch (error) {

    console.error(error);

    estado.textContent =
      "❌ No pude acceder a la cámara";

    hablar("No puedo acceder a la cámara.");

  }
}


/* =====================================
   ⛔ APAGAR CÁMARA
===================================== */

function apagarCamara() {

  if (stream) {

    stream.getTracks().forEach(track => {
      track.stop();
    });

    stream = null;
  }

  video.srcObject = null;

  estado.textContent =
    "🔴 Cámara apagada";
}


/* =====================================
   🔊 HACER HABLAR A LA IA
===================================== */

function hablar(mensaje) {

  /*
    MUY IMPORTANTE:
    detener el micrófono antes de hablar.
    Así la IA no escucha su propia voz.
  */

  detenerEscucha();

  speechSynthesis.cancel();

  hablando = true;

  resultado.textContent =
    "🤖 " + mensaje;

  const voz =
    new SpeechSynthesisUtterance(mensaje);

  voz.lang = "es-ES";
  voz.rate = 1;
  voz.pitch = 1;
  voz.volume = 1;

  voz.onend = function () {

    hablando = false;

    /*
      Esperamos un poquito antes
      de volver a escuchar.
    */

    setTimeout(function () {

      iniciarEscucha();

    }, 600);

  };

  speechSynthesis.speak(voz);
}


/* =====================================
   🎤 RECONOCIMIENTO DE VOZ
===================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  reconocimiento =
    new SpeechRecognition();

  reconocimiento.lang = "es-ES";

  reconocimiento.continuous = true;

  reconocimiento.interimResults = true;


  reconocimiento.onstart = function () {

    escuchando = true;

    estado.textContent =
      "🎤 Escuchando...";

  };


  reconocimiento.onresult = function (event) {

    /*
      Si la IA está hablando,
      ignoramos completamente
      lo que pueda escuchar.
    */

    if (hablando) {
      return;
    }


    let frase = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      frase +=
        event.results[i][0].transcript;

    }


    frase = frase.trim();


    if (!frase) {
      return;
    }


    /*
      Si el usuario empieza a hablar
      mientras la IA todavía está
      terminando una frase, la cortamos.
    */

    if (speechSynthesis.speaking) {

      speechSynthesis.cancel();

      hablando = false;
    }


    resultado.textContent =
      "👤 " + frase;


    /*
      Cada vez que habla,
      reiniciamos el temporizador.

      Cuando pasan 1 segundo sin hablar,
      procesamos la frase.
    */

    clearTimeout(temporizador);

    temporizador =
      setTimeout(function () {

        procesar(frase);

      }, 1000);

  };


  reconocimiento.onerror = function (event) {

    console.log(
      "Error de reconocimiento:",
      event.error
    );

  };


  reconocimiento.onend = function () {

    escuchando = false;

    /*
      Si la IA no está hablando,
      volvemos a escuchar.
    */

    if (!hablando) {

      setTimeout(function () {

        iniciarEscucha();

      }, 400);

    }

  };

} else {

  estado.textContent =
    "❌ Tu navegador no permite reconocimiento de voz.";

}


/* =====================================
   🎤 INICIAR ESCUCHA
===================================== */

function iniciarEscucha() {

  if (!reconocimiento) {
    return;
  }

  if (hablando) {
    return;
  }

  if (escuchando) {
    return;
  }

  try {

    reconocimiento.start();

  } catch (error) {

    console.log(error);

  }
}


/* =====================================
   🛑 DETENER ESCUCHA
===================================== */

function detenerEscucha() {

  if (!reconocimiento) {
    return;
  }

  try {

    reconocimiento.stop();

  } catch (error) {

    console.log(error);

  }

  escuchando = false;
}


/* =====================================
   🧠 PROCESAR LO QUE DICES
===================================== */

function procesar(frase) {

  const texto =
    frase
      .toLowerCase()
      .trim();


  /* =================================
     📷 PRENDER CÁMARA
  ================================= */

  if (
    texto.includes("prende la cámara") ||
    texto.includes("prende cámara") ||
    texto.includes("enciende la cámara") ||
    texto.includes("enciende cámara") ||
    texto.includes("activa la cámara") ||
    texto.includes("activar cámara")
  ) {

    encenderCamara("environment");

    hablar(
      "He encendido la cámara."
    );

    return;
  }


  /* =================================
     ⛔ APAGAR CÁMARA
  ================================= */

  if (
    texto.includes("apaga la cámara") ||
    texto.includes("apaga cámara") ||
    texto.includes("apagar la cámara") ||
    texto.includes("apagar cámara") ||
    texto.includes("desactiva la cámara")
  ) {

    apagarCamara();

    hablar(
      "He apagado la cámara."
    );

    return;
  }


  /* =================================
     🤳 CÁMARA FRONTAL
  ================================= */

  if (
    texto.includes("cámara frontal") ||
    texto.includes("camara frontal") ||
    texto.includes("frontal")
  ) {

    encenderCamara("user");

    hablar(
      "He cambiado a la cámara frontal."
    );

    return;
  }


  /* =================================
     📷 CÁMARA TRASERA
  ================================= */

  if (
    texto.includes("cámara trasera") ||
    texto.includes("camara trasera") ||
    texto.includes("cámara de atrás") ||
    texto.includes("camara de atras") ||
    texto.includes("trasera")
  ) {

    encenderCamara("environment");

    hablar(
      "He cambiado a la cámara trasera."
    );

    return;
  }


  /* =================================
     👁️ PREGUNTAS SOBRE LA CÁMARA
  ================================= */

  if (
    texto.includes("qué ves") ||
    texto.includes("que ves") ||
    texto.includes("qué hay delante") ||
    texto.includes("que hay delante") ||
    texto.includes("qué tengo delante") ||
    texto.includes("que tengo delante") ||
    texto.includes("describe lo que ves") ||
    texto.includes("describe lo que estás viendo") ||
    texto.includes("describe lo que estas viendo") ||
    texto.includes("qué hay en la cámara") ||
    texto.includes("que hay en la camara")
  ) {

    analizarImagen();

    return;
  }


  /* =================================
     💬 POR AHORA
  ================================= */

  hablar(
    "Te he escuchado. La inteligencia para conversar la añadiremos después."
  );

}


/* =====================================
   👁️ ANALIZAR CÁMARA
===================================== */

function analizarImagen() {

  if (!stream) {

    hablar(
      "La cámara está apagada."
    );

    return;
  }


  /*
    Capturamos el fotograma actual.
    Más adelante aquí conectaremos
    el modelo visual.
  */

  const canvas =
    document.createElement("canvas");

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  estado.textContent =
    "👁️ Analizando imagen...";


  setTimeout(function () {

    hablar(
      "Ya tengo la imagen. Ahora conectaremos el modelo de visión para decirte exactamente qué estoy viendo."
    );

  }, 500);

}


/* =====================================
   🔘 BOTONES
===================================== */

encender.onclick =
  function () {

    encenderCamara("environment");

  };


apagar.onclick =
  function () {

    apagarCamara();

  };


/* =====================================
   🚀 INICIO
===================================== */

estado.textContent =
  "🟢 Lista. Puedes hablar conmigo.";

</script>

</body>
  </html>
