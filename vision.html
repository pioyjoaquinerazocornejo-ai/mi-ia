<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IA - Prueba de cerebro</title>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin-bottom: 10px;
}

#estado {
  margin: 20px 0;
  font-size: 18px;
}

#resultado {
  background: #222;
  border-radius: 15px;
  padding: 18px;
  margin-top: 20px;
  min-height: 50px;
  text-align: left;
  white-space: pre-wrap;
}

textarea {
  width: 95%;
  max-width: 700px;
  height: 100px;
  border-radius: 12px;
  border: none;
  padding: 12px;
  font-size: 16px;
  box-sizing: border-box;
}

button {
  margin-top: 12px;
  padding: 14px 22px;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;
}

#enviar {
  background: #2979ff;
  color: white;
}
</style>
</head>

<body>

<h1>🧠 Mi IA</h1>

<div id="estado">
⏳ Cargando cerebro...
</div>

<textarea
  id="pregunta"
  placeholder="Escribe algo para la IA..."
></textarea>

<br>

<button id="enviar">
💬 Preguntar
</button>

<div id="resultado">
Aquí aparecerá la respuesta.
</div>

<script type="module">

import { pipeline } from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";


const estado =
document.getElementById("estado");

const pregunta =
document.getElementById("pregunta");

const enviar =
document.getElementById("enviar");

const resultado =
document.getElementById("resultado");


let cerebro = null;


/* ================================
   🧠 CARGAR CEREBRO
================================ */

async function cargarCerebro() {

  try {

    estado.textContent =
      "🧠 Cargando Qwen 0.5B Q4...";

    cerebro =
      await pipeline(
        "text-generation",
        "onnx-community/Qwen2.5-0.5B-Instruct",
        {
          dtype: "q4",
          device: "webgpu"
        }
      );

    estado.textContent =
      "🟢 Cerebro listo";

    resultado.textContent =
      "Ya estoy listo. Pregúntame algo.";

  }

  catch(error) {

    console.error(error);

    estado.textContent =
      "❌ Error al cargar el cerebro";

    resultado.textContent =
      error.message;

  }

}


/* ================================
   💬 PREGUNTAR
================================ */

async function preguntar() {

  if (!cerebro) {

    resultado.textContent =
      "⏳ El cerebro todavía se está cargando.";

    return;

  }


  const texto =
    pregunta.value.trim();


  if (!texto) {
    return;
  }


  enviar.disabled = true;

  estado.textContent =
    "🧠 Pensando...";

  resultado.textContent =
    "🤔 Pensando...";


  try {

    const mensajes = [

      {
        role: "system",
        content:
          "Eres una IA asistente llamada Pío IA. Responde siempre en español. Sé clara y útil. Si el usuario pide una explicación, explica paso a paso y con ejemplos. Si pide programación, enseña el código y explica cómo funciona."
      },

      {
        role: "user",
        content: texto
      }

    ];


    const salida =
      await cerebro(
        mensajes,
        {
          max_new_tokens: 256,
          temperature: 0.7
        }
      );


    const respuesta =
      salida[0]
        .generated_text
        .at(-1)
        .content;


    resultado.textContent =
      respuesta;


    estado.textContent =
      "🟢 Listo";

  }

  catch(error) {

    console.error(error);

    estado.textContent =
      "❌ Error";

    resultado.textContent =
      error.message;

  }


  enviar.disabled = false;

}


/* ================================
   🔘 BOTÓN
================================ */

enviar.onclick =
  preguntar;


/* ================================
   ⌨️ ENTER
================================ */

pregunta.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      preguntar();

    }

  }
);


/* ================================
   🚀 INICIAR
================================ */

cargarCerebro();

</script>

</body>
</html>
